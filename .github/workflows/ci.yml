name: CI Passing

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs:verify
      - run: npm run test:server
      - name: npm audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run evaluate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r experiments/medwear/requirements-min.txt
      - run: npm run evaluate:supplement
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test-and-evaluate
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medwear-api .
